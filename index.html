<style>
/* Layout: sticky header + tab bar, one column workspace; ink-blue document feel with saffron accent */

*{box-sizing:border-box}

const khCal=(()=>{
  const DAY=864e5,REF=286596e5;
  const h=y=>Math.floor((292207*y+373)/800)+1, a=y=>(292207*y+373)%800, v=y=>(11*h(y)+650)%692;

st keys = [];\n  cls.forEach(c => (c[key] || []).forEach(o => Object.keys(o).forEach(k => {\n    if (k !== 'id' && k !== 'photo' && keys.indexOf(k) < 0) keys.push(k);\n  })));\n  keys.sort((a, b) => (ORDER.indexOf(a) < 0 ? 99 : ORDER.indexOf(a)) - (ORDER.indexOf(b) < 0 ? 99 : ORDER.indexOf(b)));\n  const rows = [];\n  cls.forEach(c => (c[key] || []).forEach(o =>\n    rows.push([c.grade, c.id, o.id].concat(keys.map(k => o[k] == null ? '' : o[k])))));\n  put_(name, ['ថ្នាក់', 'លេខថ្នាក់', 'លេខកូដ'].concat(keys.map(k => LBL[k] || k)), rows);\n}\n\nfunction put_(name, head, rows) {\n  const sh = sheet_(name), w = head.length;\n  sh.clear();\n  sh.getRange(1, 1, 1, w).setValues([head]).setFontWeight('bold').setBackground('#e8eefc');\n  if (rows.length) {\n    rows = rows.map(r => { r = r.slice(0, w).map(v => v == null ? '' : String(v)); while (r.length < w) r.push(''); return r; });\n    sh.getRange(2, 1, rows.length, w).setNumberFormat('@').setValues(rows);\n  }\n  sh.setFrozenRows(1);\n}\n\n/* ---------- អាន (Sheet ជាប្រភពពិត) ---------- */\nfunction tbl_(name) {\n  const sh = ss_().getSheetByName(name);\n  if (!sh || sh.getLastRow() < 1) return null;\n  const v = sh.getDataRange().getValues().map(r => r.map(x => x == null ? '' : String(x).trim()));\n  return { head: v[0], rows: v.slice(1).filter(r => r.some(x => x !== '')) };\n}\nconst num_ = x => (x !== '' && !isNaN(x)) ? Number(x) : x;\n\nfunction read_() {\n  const ct = tbl_(S_CLS);\n  if (!ct || !ct.rows.length) return null;            // Sheet ទទេ → ប្រព័ន្ធផ្ញើទិន្នន័យឡើង\n\n  const photos = {}, pt = tbl_(S_PHOTO);\n  if (pt) {\n    const parts = {};\n    pt.rows.forEach(r => { (parts[r[0]] = parts[r[0]] || []).push([Number(r[1]), r[2]]); });\n    Object.keys(parts).forEach(k => photos[k] = parts[k].sort((a, b) => a[0] - b[0]).map(p => p[1]).join(''));\n  }\n  const info = {}, it = tbl_(S_INFO);\n  if (it) it.rows.forEach(r => { if (r[0] !== '') info[r[0]] = r[1]; });\n  info.logo = photos.logo || '';\n\n  const classes = [], byId = {}, byGrade = {};\n  let maxC = 0; ct.rows.forEach(r => { const n = Number(r[1]); if (n > maxC) maxC = n; });\n  ct.rows.forEach(r => {\n    if (r[0] === '') return;\n    const id = r[1] === '' ? ++maxC : Number(r[1]);\n    const c = { id: id, grade: r[0], cover: photos['cover:' + id] || '',\n                members: [], months: r[2] === '' ? [] : r[2].split(',').map(s => s.trim()), acts: [], meetings: [] };\n    classes.push(c); byId[id] = c; byGrade[r[0]] = c;\n  });\n  if (!classes.length) return null;\n  const find = r => byId[Number(r[1])] || byGrade[r[0]];\n\n  [[S_MEM, 'members', true], [S_MEET, 'meetings', false]].forEach(([name, key, withPhoto]) => {\n    const t = tbl_(name); if (!t) return;\n    const keys = t.head.slice(3).map(h => REV[h] || h);\n    t.rows.forEach(r => {\n      const c = find(r); if (!c) return;               // ជួរដែលគ្មានថ្នាក់ត្រូវគ្នា ត្រូវបានរំលង\n      const o = {}; keys.forEach((k, i) => { if (k) o[k] = r[3 + i] == null ? '' : r[3 + i]; });\n      if (!Object.keys(o).some(k => o[k] !== '')) return;\n      let max = 0; c[key].forEach(x => { if (x.id > max) max = x.id; });\n      o.id = r[2] === '' ? max + 1 : num_(r[2]);\n      if (key === 'members') o.photo = photos['m:' + c.id + ':' + o.id] || '';\n      c[key].push(o);\n    });\n  });\n\n  const dt = tbl_(S_DOC);\n  if (dt) dt.rows.forEach(r => {\n    const c = find(r); if (!c || r[2] === '' || r[3] === '') return;\n    c.docs = c.docs || {}; (c.docs[r[2]] = c.docs[r[2]] || {})[r[3]] = r[4];\n  });\n  const pl = tbl_(S_PLAN);\n  if (pl) pl.rows.forEach(r => {\n    const c = find(r); if (!c || r[3] === '') return;\n    const a = { id: r[2] === '' ? c.acts.length + 1 : num_(r[2]), t: r[3], c: {} };\n    for (let i = 4; i < r.length && i - 4 < c.months.length; i++) {\n      const v = r[i]; if (v === '') continue;\n      a.c[i - 4] = (v === '●' || v === '2') ? 2 : 1;\n    }\n    c.acts.push(a);\n  });\n  return { v: 3, info: info, cur: classes[0].id, classes: function fitPages(root,keep){
  const over=pg=>pg.scrollHeight>pg.clientHeight+1;
  [...(root||document).querySelectorAll('.pg')].forEach(pg=>{const d=pg.querySelector('.doc');if(!d)return;
    let k=keep?(+d.style.getPropertyValue('--k')||1):1;d.style.setProperty('--k',k);
    for(let n=0;n<20&&over(pg)&&k>(keep?.5:.86);n++){k=+(k-.03).toFixed(2);d.style.setProperty('--k',k)}

async function savePdf(btn){
  if(!DL||!window.html2canvas||!window.jspdf){toast('មិនអាចបង្កើត PDF នៅទីនេះបានទេ');return}
  const old=btn.textContent;btn.disabled=true;btn.textContent='កំពុងបង្កើត…';
  const box=document.createElement('div');box.style.cssText='position:fixed;left:-10000px;top:0;width:794px;background:#fff';document.body.appendChild(box);
  try{
    await document.fonts.ready;
    const pdf=new jspdf.jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
    const isDoc=tab=='meetings';let pages;
    if(isDoc){docLive=false;try{box.innerHTML='<section class="pg docpg pgx">'+({min:docMin,abs:docAbs,req:docReq})[docKind]()+'</section>'}finally{docLive=true}fitPages(box);pages=[...box.querySelectorAll('.pg')]}
    else pages=[...document.querySelectorAll('.pages .pg')];
    for(let k=0;k<pages.length;k++){
      let c=pages[k];if(!isDoc){c=pages[k].cloneNode(true);c.classList.add('pgx');box.innerHTML='';box.appendChild(c)}
      await new Promise(r=>setTimeout(r,60));
      const cv=await html2canvas(c,{scale:2,backgroundColor:'#ffffff',useCORS:true});
      if(k)pdf.addPage();
      pdf.addImage(cv.toDataURL('image/jpeg',.92),'JPEG',0,0,210,297);
    }
    await DL.save({filename:btn.dataset.fn||('kkt-'+String(cl().grade).replace(/[^\w-]/g,'')+'.pdf'),data:pdf.output('blob')});
    toast('បានរក្សាទុក PDF');
  }catch(e){toast(e&&e.code=='declined'?'បានបោះបង់':'បង្កើត PDF មិនបានសម្រេច')}
  finally{box.remove();btn.disabled=false;btn.textContent=old}
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a, id=+b.dataset.id;
  if(a=='pdf'){savePdf(b);return}
  if(a=='selCls'){S.cur=id;persist();editing=null;confirmId=null;toast('បានប្ដូរទៅថ្នាក់ '+cl().grade)}
  else if(a=='delCls'){if(S.classes.length<2){toast('មិនអាចលុបថ្នាក់តែមួយគត់បានទេ')}else if(confirmId!='c'+id){confirmId='c'+id}else{
    S.classes=S.classes.filter(c=>c.id!=id);if(!S.classes.some(c=>c.id==S.cur))S.cur=S.classes[0].id;confirmId=null;save(id);toast('បានលុបថ្នាក់')}}
  else if(a=='gsConnect'){const u=document.getElementById('gsurl').value.trim();
    if(!/^https:\/\/script\.google(usercontent)?\.com\/.+/.test(u)){toast('URL មិនត្រឹមត្រូវ — ត្រូវចាប់ផ្ដើម https://script.google.com/macros/s/…/exec');return}
    if(/\/dev(\?.*)?$/.test(u)){toast('URL /dev មិនអាចប្រើបានទេ — ត្រូវ Deploy ជា Web app ហើយយក URL ដែលបញ្ចប់ដោយ /exec');return}
    lsSet('kkt-gs',u);gsPull().then(ok=>{toast(ok?'ភ្ជាប់ Google Sheet បានជោគជ័យ':'ភ្ជាប់មិនបាន')});return}
  else if(a=='gsPull2'){if(!gsUrl()){toast('សូមភ្ជាប់ជាមុន');return}gsPull().then(()=>toast('បានទាញទិន្នន័យ'));return}
  else if(a=='gsPush2'){if(!gsUrl()){toast('សូមភ្ជាប់ជាមុន');return}gsPush().then(()=>toast(GS.st=='on'?'បានផ្ញើទិន្នន័យ':'ផ្ញើមិនបាន'));return}
  else if(a=='gsDisc'){try{localStorage.removeItem('kkt-gs')}catch(e){}GS.st='off';GS.msg='';toast('បានផ្ដាច់')}
  else if(a=='gsCopy'){const t=GS_CODE;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('បានចម្លងកូដ'),()=>{const p=document.getElementById('gsCode'),r=document.createRange();r.selectNodeContents(p);const s=getSelection();s.removeAllRanges();s.addRange(r);toast('សូមចុច Ctrl+C')});return}
  else
  if(a=='newMem'){editing={t:'m',o:{sex:'ស្រី',cat:CATS[0],role:'សមាជិក'}}}
  else if(a=='editMem'){editing={t:'m',o:cl().members.find(x=>x.id==id)}}
  else if(a=='newMeet'){editing={t:'e',o:{}}}
  else if(a=='editMeet'){editing={t:'e',o:cl().meetings.find(x=>x.id==id)}}
  else if(a=='cancel'){editing=null}
  else if(a=='docTab'){docKind=b.dataset.k;confirmId=null}
  else if(a=='docReset'){if(confirmId!='dr'){confirmId='dr'}else{const c=cl();c.docs=c.docs||{};c.docs[docKind]={};confirmId=null;save();toast('បានត្រឡប់ទៅលំនាំដើម')}}
  else if(a=='absRow'){const c=cl();c.docs=c.docs||{};const d=c.docs.abs=c.docs.abs||{};d._x=String(Math.max(0,(parseInt(d._x==null?2:d._x)||0)+id));save()}
  else if(a=='cell'){const x=cl().acts.find(q=>q.id==id),i=b.dataset.i;x.c[i]=((x.c[i]||0)+1)%3;save()}
  else if(a=='delMem'||a=='delAct'||a=='delMeet'||a=='reset'){
    const k=a=='delMem'?'m'+id:a=='delAct'?'a'+id:a=='delMeet'?'e'+id:'reset';
    if(confirmId!=k){confirmId=k}else{
      if(a=='delMem')cl().members=cl().members.filter(x=>x.id!=id);
      if(a=='delAct')cl().acts=cl().acts.filter(x=>x.id!=id);
      if(a=='delMeet')cl().meetings=cl().meetings.filter(x=>x.id!=id);
      if(a=='reset'){S=SEED();persist();gsSchedule()}
      confirmId=null;save();toast('បានអនុវត្ត')}
  }
  else if(a=='export'){
    const s=JSON.stringify(S),t=document.getElementById('blob');t.value=s;t.select();
    (navigator.clipboard?navigator.clipboard.writeText(s):Promise.reject()).then(()=>toast('បានចម្លងកូដ'),()=>toast('សូមចម្លងកូដដោយដៃ'));return}
  else if(a=='import'){
    try{const o=JSON.parse(document.getElementById('blob').value);
      const n=normalize(o);if(!n||!n.classes.length)throw 0;
      S=n;if(!S.classes.some(c=>c.id==S.cur))S.cur=S.classes[0].id;persist();gsSchedule();toast('នាំចូលបានជោគជ័យ')}catch(x){toast('កូដមិនត្រឹមត្រូវ');return}}
  render();
});

  if(f.id=='infoForm'){const {grade,cover,...rest}=d;S.info={...S.info,...rest};const c=cl();if(grade&&grade.trim())c.grade=grade.trim();c.cover=cover||'';save();toast('បានរក្សាទុក');render();return}
  if(f.id=='memForm'){

  if(f.id=='monForm'){const m=d.m.split(/[,،]/).map(x=>x.trim()).filter(Boolean).slice(0,14);if(m.length){cl().months=m;cl().acts.forEach(a=>a.c={});save();toast('បានប្ដូរខែ ហើយសម្អាតប្រអប់')}render()}

function fillDates(){
  const g=document.getElementById('signG'),hint=document.getElementById('signHint');if(!g)return;
  const p=khParseDate(g.value);
  if(!p){if(hint)hint.style.color=g.value.trim()?'var(--warn)':'';if(hint&&g.value.trim())hint.textContent='ទម្រង់កាលបរិច្ឆេទមិនត្រឹមត្រូវ។ សូមបញ្ចូលដូច 19/11/2026';return}
  const r=khDates(p.y,p.m,p.d,document.getElementById('fPlace').value.trim()||'កណ្តៀង');
  document.getElementById('fLunar').value=r.lunarLine;document.getElementById('fSign').value=r.solarLine;
  hint.style.color='var(--ok)';hint.textContent='បានបំពេញស្វ័យប្រវត្តិ៖ '+r.lunarLine+' · '+r.solarLine;
}

document.addEventListener('change',e=>{

    const k=Math.min(1,+f.dataset.max/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);

});
